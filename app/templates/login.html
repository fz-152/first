{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
  <h1>Вход в личный кабинет</h1>
  {% if default_pw %}<p class="muted">Первый запуск. Пароль администратора: <code>{{ default_pw }}</code>
  (сохраните и смените его).</p>{% endif %}
  <form method="post">
    <p><label>Логин<br><input type="text" name="login" required autofocus></label></p>
    <p><label>Пароль<br><input type="password" name="password" required></label></p>
    <button class="btn" type="submit">Войти</button>
  </form>
  <p class="muted">Демо-доступы: auditor/auditor123 (аудитор), user/user123 (пользователь).</p>
</div>
{% endblock %}
